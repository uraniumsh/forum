<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uranium | Control de Inventario y Ventas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js" defer></script>
</head>
<body>

    <header class="navbar">
        <div class="logo">URANIUM<span>ERP</span></div>
        <div class="user-controls">
            <button id="btnOpenProductModal" class="accent-outline-btn">NUEVO PRODUCTO</button>
            <button id="btnOpenSaleModal" class="accent-btn">REGISTRAR VENTA</button>
        </div>
    </header>

    <main class="container">
        
        <section class="metrics-grid">
            <div class="metric-card">
                <h3>INGRESOS TOTALES</h3>
                <div class="metric-value accent-text" id="totalRevenue">$0</div>
            </div>
            <div class="metric-card">
                <h3>VENTAS REALIZADAS</h3>
                <div class="metric-value" id="totalSalesCount">0</div>
            </div>
            <div class="metric-card">
                <h3>PRODUCTOS EN STOCK</h3>
                <div class="metric-value" id="totalStockCount">0</div>
            </div>
        </section>

        <div class="tables-layout">
            <section class="table-section">
                <div class="section-header">
                    <h2>INVENTARIO ACTUAL</h2>
                </div>
                <div class="table-container">
                    <table id="inventoryTable">
                        <thead>
                            <tr>
                                <th>PRODUCTO</th>
                                <th>PRECIO VENTA</th>
                                <th>STOCK</th>
                                <th>ESTADO</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryBody">
                            <tr><td colspan="4" class="text-center text-muted">Cargando inventario...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="table-section">
                <div class="section-header">
                    <h2>ÚLTIMAS VENTAS</h2>
                </div>
                <div class="table-container">
                    <table id="salesTable">
                        <thead>
                            <tr>
                                <th>FECHA</th>
                                <th>PRODUCTO</th>
                                <th>CANT.</th>
                                <th>TOTAL INGRESADO</th>
                            </tr>
                        </thead>
                        <tbody id="salesBody">
                            <tr><td colspan="4" class="text-center text-muted">Cargando ventas...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <div id="productModal" class="modal hidden">
        <div class="modal-content square-modal">
            <button class="close-btn" data-close="productModal">&times;</button>
            <h2 class="accent-text title-font">AGREGAR AL INVENTARIO</h2>
            
            <div class="form-group mt-20">
                <label>Nombre del Producto:</label>
                <input type="text" id="prodName" placeholder="Ej. Perfil Netflix, Tenis Nike, etc.">
            </div>
            <div class="form-group">
                <label>Precio de Venta (COP):</label>
                <input type="number" id="prodPrice" placeholder="Ej. 15000">
            </div>
            <div class="form-group">
                <label>Stock Inicial (Cantidad):</label>
                <input type="number" id="prodStock" placeholder="Ej. 10">
            </div>
            
            <button id="submitProductBtn" class="accent-btn w-100 mt-20">GUARDAR PRODUCTO</button>
        </div>
    </div>

    <div id="saleModal" class="modal hidden">
        <div class="modal-content square-modal">
            <button class="close-btn" data-close="saleModal">&times;</button>
            <h2 class="accent-text title-font">REGISTRAR NUEVA VENTA</h2>
            
            <div class="form-group mt-20">
                <label>Seleccionar Producto:</label>
                <select id="saleProductSelect">
                    <option value="">-- Elige un producto --</option>
                    </select>
            </div>
            <div class="form-group">
                <label>Cantidad Vendida:</label>
                <input type="number" id="saleQuantity" value="1" min="1">
            </div>
            
            <div class="calculator-box">
                <p>TOTAL A COBRAR:</p>
                <h2 id="saleTotalText" class="accent-text">$0 COP</h2>
            </div>
            
            <button id="submitSaleBtn" class="accent-btn w-100 mt-20">CONFIRMAR VENTA</button>
            <div id="saleError" class="error-text text-center mt-10"></div>
        </div>
    </div>

</body>
</html>
